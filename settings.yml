# SearXNG settings
# https://docs.searxng.org/admin/settings/
#
# This file is copied into the container volume on first run.
# The secret_key is replaced automatically by setup.sh.
# To customise further, edit the copy inside the volume:
#   podman exec searxng cat /etc/searxng/settings.yml

use_default_settings: true

server:
  secret_key: "GENERATED_AT_SETUP"
  image_proxy: true

search:
  formats:
    - html
    - json

# Route all outgoing requests through a local Tor SOCKS5 proxy.
# Requires Tor running on the host (brew install tor && brew services start tor).
# The container reaches the host via host.containers.internal.
outgoing:
  proxies:
    "all://":
      - "socks5h://host.containers.internal:9050"
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
